name: catalogtest

services:
  database:
    image: postgres:16-alpine
    container_name: catalogtest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - catalogtest

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogtest-php
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app:rw
      - php_var:/app/var
      - composer_cache:/root/.composer/cache
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://app:app@database:5432/app?serverVersion=16&charset=utf8
    depends_on:
      database:
        condition: service_healthy
    networks:
      - catalogtest

  nginx:
    image: nginx:1.27-alpine
    container_name: catalogtest-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - catalogtest

  pgsql:
    profiles: ["tools"]
    image: postgres:16-alpine
    container_name: catalogtest-pgsh
    restart: "no"
    environment:
      PGPASSWORD: app
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ["psql"]
    command: ["-h", "database", "-U", "app", "-d", "app"]
    depends_on:
      - database
    networks:
      - catalogtest

volumes:
  postgres_data:
  composer_cache:
  php_var:

networks:
  catalogtest:
    driver: bridge
